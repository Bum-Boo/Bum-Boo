<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">A working method from friction to a useful change</title>
  <desc id="desc">Notice an everyday friction, explore it across disciplines, make a concrete prototype, and return it to everyday use.</desc>
  <style>
    .serif{font-family:Georgia,"Times New Roman",serif;fill:#27231f}
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#575149}
    .eyebrow{font-size:15px}.title{font-size:38px}.step{font-size:22px}.copy{font-size:15px}
  </style>
  <rect x="1" y="1" width="1198" height="418" rx="6" fill="#f3efe6" stroke="#cec5b8" stroke-width="2"/>
  <text x="58" y="52" class="sans eyebrow">A working method</text>
  <text x="58" y="98" class="serif title">From an overlooked friction to a useful change</text>
  <line x1="58" y1="126" x2="1142" y2="126" stroke="#c9c0b4"/>
  <path d="M120 232 C260 188 322 278 445 232 S650 188 735 232 S930 279 1080 232" fill="none" stroke="#9f9588" stroke-width="2"/>
  <g>
    <circle cx="120" cy="232" r="29" fill="#7b2d3e"/><text x="120" y="239" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fffaf2">1</text>
    <text x="78" y="298" class="serif step">Notice</text>
    <text x="78" y="328" class="sans copy">Find what feels heavy,</text><text x="78" y="349" class="sans copy">hidden, or needlessly dull.</text>
  </g>
  <g>
    <circle cx="445" cy="232" r="29" fill="#315b4e"/><text x="445" y="239" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fffaf2">2</text>
    <text x="395" y="298" class="serif step">Explore</text>
    <text x="395" y="328" class="sans copy">Cross disciplines and ask</text><text x="395" y="349" class="sans copy">what the situation needs.</text>
  </g>
  <g>
    <circle cx="735" cy="232" r="29" fill="#b7523a"/><text x="735" y="239" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fffaf2">3</text>
    <text x="700" y="298" class="serif step">Make</text>
    <text x="700" y="328" class="sans copy">Build something concrete,</text><text x="700" y="349" class="sans copy">then test its boundaries.</text>
  </g>
  <g>
    <circle cx="1080" cy="232" r="29" fill="#3d5365"/><text x="1080" y="239" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fffaf2">4</text>
    <text x="1034" y="298" class="serif step">Return</text>
    <text x="980" y="328" class="sans copy">See whether everyday life</text><text x="980" y="349" class="sans copy">is clearer or more capable.</text>
  </g>
  <text x="58" y="394" class="sans eyebrow">The medium can change. Human choice should remain visible.</text>
</svg>
