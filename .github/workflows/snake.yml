name: Snake

on:
  schedule:
    - cron: "40 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#c9a046&color_dots=#0d1117,#0b3d2e,#1f7a5c,#8a2230,#c9a046
            dist/snake-light.svg?palette=github-light&color_snake=#8a2230&color_dots=#ebedf0,#b9d8c8,#5fae8c,#1f7a5c,#0b3d2e

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
